# Grafana dashboard provisioning configuration

apiVersion: 1

providers:
  - name: 'BillFusion Auth Service'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards

