# Render Blueprint for BillFusion Auth Service
# This file defines all services needed for production deployment

services:
  # Main Auth Service (FastAPI)
  - type: web
    name: billfusion-auth-service
    runtime: python
    plan: starter  # Free tier, upgrade to standard for production
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true  # Render will generate a secure secret
      - key: JWT_SECRET_KEY
        generateValue: true  # Render will generate a secure JWT secret
      - key: DATABASE_URL
        fromDatabase:
          name: billfusion-auth-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: billfusion-auth-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://your-frontend-domain.vercel.app,https://billfusion.com"
      - key: ALLOWED_HOSTS
        value: "billfusion-auth-service.onrender.com,localhost"
      - key: EMAIL_BACKEND
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false  # Set this in Render dashboard
      - key: SMTP_PASSWORD
        sync: false  # Set this in Render dashboard
      - key: FRONTEND_URL
        value: "https://your-frontend-domain.vercel.app"
      - key: GOOGLE_CLIENT_ID
        sync: false  # Set this in Render dashboard
      - key: GOOGLE_CLIENT_SECRET
        sync: false  # Set this in Render dashboard
    healthCheckPath: /health
    
  # PostgreSQL Database
  - type: database
    name: billfusion-auth-db
    databaseName: billfusion_auth
    user: postgres
    plan: starter  # Free tier, 1GB storage
    
  # Redis Cache
  - type: redis
    name: billfusion-auth-redis
    plan: starter  # Free tier, 25MB storage
    maxmemoryPolicy: allkeys-lru
